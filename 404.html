<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>St. George College</title>
<script>
(async function(){
  const routes={login:'login.html',portal:'portal.html',staff:'staff.html',admin:'admin.html','change-password':'change-password.html'};
  const path=location.pathname.replace(/\/+$/,'');
  const page=path.split('/').pop().replace(/\.html$/,'');
  const target=routes[page];
  if(!target){
    document.title='Page Not Found | St. George College';
    document.body.innerHTML='<main style="font-family:Arial,sans-serif;padding:60px;text-align:center"><h1>Page not found</h1><p>The page you requested could not be found.</p><a href="./">Return to St. George College</a></main>';
    return;
  }
  try{
    const response=await fetch(target,{cache:'no-store'});
    if(!response.ok) throw new Error('Page unavailable');
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="font-family:Arial,sans-serif;padding:60px;text-align:center"><h1>Unable to load this page</h1><p>Please refresh and try again.</p><a href="./">Return to St. George College</a></main>';
  }
})();
</script>
</head>
<body></body>
</html>
