<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14294c"><link rel="icon" type="image/png" sizes="512x512" href="assets/school-favicon.png"><link rel="apple-touch-icon" href="assets/school-favicon.png"><title>Admin Panel | XOLII DAILY BETS</title><link rel="stylesheet" href="assets/style.css"></head><body class="portal"><aside><a class="logo brand-logo light" href="portal"><img src="assets/school-logo.png" alt="XOLII DAILY BETS"></a><nav><a href="portal">← Member Area</a><a class="active" href="admin">Admin Dashboard</a><a href="#noticesAdmin">Betting Updates</a><a href="#membersAdmin">Members</a><a href="#eventsAdmin">Fixtures</a><a href="#achievementsAdmin">Picks &amp; Results</a><a href="#settings">Settings</a></nav><button id="logout">Sign out</button></aside><main class="main"><header class="top"><div><label>ADMINISTRATION</label><h1>Xolii Control Centre</h1></div><div class="user"><span>ADMIN</span><b id="user"></b></div></header>
<div class="stats"><div><b id="an">0</b><small>Betting updates</small></div><div><b id="am">0</b><small>Members</small></div><div><b id="ae">0</b><small>Fixtures</small></div></div>
<section id="noticesAdmin"><label>CONTENT</label><h2>Manage Betting Updates</h2><form id="noticeForm" class="form"><input type="hidden" id="nid"><input id="ntitle" required placeholder="Update or pick title"><input id="ndate" type="date" required><select id="naud"><option value="all">Everyone</option><option value="learners">Free Members only</option><option value="staff">Premium Members only</option></select><select id="ncat"><option>General</option><option>Free Pick</option><option>Premium Pick</option><option>Results</option><option>News</option></select><textarea id="ntext" required placeholder="Pick, analysis or betting update"></textarea><button class="btn dark">Save update</button><button type="button" id="clearNotice">Clear</button></form><div id="noticeAdminList" class="manage"></div></section>
<section id="membersAdmin"><label>PEOPLE</label><h2>Manage Members</h2><form id="memberForm" class="form"><input type="hidden" id="mid"><input id="mname" required placeholder="Member name"><input id="memail" type="email" required placeholder="Email"><select id="mrole"><option value="learner">Free Member</option><option value="staff">Premium Member</option><option value="admin">Administrator</option></select><input id="mdept" placeholder="Plan / notes"><input id="mpassword" type="password" minlength="8" placeholder="Temporary password (8+ characters)" autocomplete="new-password"><button class="btn dark" type="submit">Create / Save member</button><button type="button" id="clearMember">Clear</button><p id="memberStatus"></p></form><div id="memberAdminList" class="manage"></div></section>
<section id="eventsAdmin"><label>FIXTURES</label><h2>Manage Betting Schedule</h2><form id="eventForm" class="form"><input id="edate" type="date" required><input id="etitle" required placeholder="Fixture or betting event"><select id="etype"><option value="event">Fixture</option><option value="holiday">Special date</option><option value="exam">Featured event</option></select><select id="eaud"><option value="all">Everyone</option><option value="learners">Free Members only</option><option value="staff">Premium Members only</option></select><button class="btn dark">Add fixture</button></form><div id="eventAdminList" class="manage"></div></section>
<section id="achievementsAdmin"><label>PICKS &amp; RESULTS</label><h2>Manage Featured Picks &amp; Results</h2><form id="achievementForm" class="form"><input type="hidden" id="aid"><input id="atitle" required placeholder="Pick title e.g. Match Winner"><input id="avalue" required placeholder="Selection e.g. HOME WIN"><input id="adesc" placeholder="Reasoning / result note"><input id="ayear" type="number" placeholder="Year"><input id="asort" type="number" placeholder="Display order"><button class="btn dark">Save pick</button></form><div id="achievementAdminList" class="manage"></div></section>
<section id="settings"><label>CONFIGURATION</label><h2>Xolii Settings</h2><form id="settingsForm" class="form"><input id="sname" value="XOLII DAILY BETS"><input id="sphone" value=""><input id="semail" value=""><input id="saddress" value=""><button class="btn dark">Save settings</button><p id="saved"></p></form></section></main><script src="assets/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="clean-urls.js"></script><script src="assets/app.js"></script></body></html>
