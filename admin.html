<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14294c"><link rel="icon" type="image/png" sizes="512x512" href="assets/school-favicon.png"><link rel="apple-touch-icon" href="assets/school-favicon.png"><title>Admin Panel | St. George College</title><link rel="stylesheet" href="assets/style.css"></head><body class="portal"><aside><a class="logo brand-logo light" href="portal"><img src="assets/school-logo.png" alt="St. George College — Excellence Through Education"></a><nav><a href="portal">← Member Portal</a><a class="active" href="admin">Admin Dashboard</a><a href="#noticesAdmin">Announcements</a><a href="#membersAdmin">Members</a><a href="#eventsAdmin">Calendar</a><a href="#achievementsAdmin">Achievements</a><a href="#settings">Settings</a></nav><button id="logout">Sign out</button></aside><main class="main"><header class="top"><div><label>ADMINISTRATION</label><h1>College Control Centre</h1></div><div class="user"><span>ADMIN</span><b id="user"></b></div></header>
<div class="stats"><div><b id="an">0</b><small>Announcements</small></div><div><b id="am">0</b><small>Members</small></div><div><b id="ae">0</b><small>Calendar events</small></div></div>
<section id="noticesAdmin"><label>CONTENT</label><h2>Manage Announcements</h2><form id="noticeForm" class="form"><input type="hidden" id="nid"><input id="ntitle" required placeholder="Announcement title"><input id="ndate" type="date" required><select id="naud"><option value="all">Everyone</option><option value="learners">Learners only</option><option value="staff">Staff only</option></select><select id="ncat"><option>General</option><option>Academic</option><option>Sports</option><option>Event</option></select><textarea id="ntext" required placeholder="Message"></textarea><button class="btn dark">Save announcement</button><button type="button" id="clearNotice">Clear</button></form><div id="noticeAdminList" class="manage"></div></section>
<section id="membersAdmin"><label>PEOPLE</label><h2>Manage Members</h2><form id="memberForm" class="form"><input type="hidden" id="mid"><input id="mname" required placeholder="Full name"><input id="memail" type="email" required placeholder="Email"><select id="mrole"><option value="learner">Learner</option><option value="staff">Staff</option><option value="src">SRC</option><option value="admin">Administrator</option></select><input id="mdept" placeholder="Grade / department"><input id="mpassword" type="password" minlength="8" placeholder="Temporary password (8+ characters)" autocomplete="new-password"><button class="btn dark" type="submit">Create / Save member</button><button type="button" id="clearMember">Clear</button><p id="memberStatus"></p></form><div id="memberAdminList" class="manage"></div></section>
<section id="eventsAdmin"><label>DATES</label><h2>Manage Calendar</h2><form id="eventForm" class="form"><input id="edate" type="date" required><input id="etitle" required placeholder="Event or holiday"><select id="etype"><option value="event">School event</option><option value="holiday">Holiday</option><option value="exam">Academic</option></select><select id="eaud"><option value="all">Everyone</option><option value="learners">Learners only</option><option value="staff">Staff only</option></select><button class="btn dark">Add date</button></form><div id="eventAdminList" class="manage"></div></section>
<section id="achievementsAdmin"><label>ACADEMICS</label><h2>Manage Academic Achievements</h2><form id="achievementForm" class="form"><input type="hidden" id="aid"><input id="atitle" required placeholder="Achievement title e.g. Circuit position"><input id="avalue" required placeholder="Value e.g. TOP 1"><input id="adesc" placeholder="Description / verification note"><input id="ayear" type="number" placeholder="Year"><input id="asort" type="number" placeholder="Display order"><button class="btn dark">Save achievement</button></form><div id="achievementAdminList" class="manage"></div></section>
<section id="settings"><label>CONFIGURATION</label><h2>School Settings</h2><form id="settingsForm" class="form"><input id="sname" value="St George College"><input id="sphone" value="015 303 2969"><input id="semail" value=""><input id="saddress" value="201 Unit, Industrial Area, Nkowankowa, 0850, Limpopo"><button class="btn dark">Save settings</button><p id="saved"></p></form></section></main><script src="assets/supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="clean-urls.js"></script><script src="assets/app.js"></script></body></html>
